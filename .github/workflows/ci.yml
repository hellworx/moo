name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: |
          if [ "${{ matrix.php }}" = "8.1" ]; then
            composer install --prefer-dist --no-progress
          else
            composer update --prefer-dist --no-progress
          fi
      - name: Run checks
        run: make check

  coverage:
    name: Coverage (PHP 8.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: xdebug
          tools: composer:v2
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run coverage
        run: make coverage

  php80:
    name: PHP 8.0 (runtime)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer:v2
      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-progress
      - name: Lint
        run: make lint
      - name: Runtime smoke
        run: |
          php -r '
          require "vendor/autoload.php";
          $moo = new Moo\Moo();
          $moo->flush = null;
          $moo->get("/", function () { return "ok"; });
          $moo(new Moo\Request(["uri" => "/"]));
          if ($moo->response->body !== "ok" || $moo->response->code !== 200) {
              fwrite(STDERR, "smoke failed\n");
              exit(1);
          }
          echo "PHP " . PHP_VERSION . " smoke OK\n";
          '
